<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><link rel="manifest" href="./manifest.json"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061b31"><title>Spider Kit Mobile</title>
<style>
:root{--red:#ed3349;--red2:#a91430;--blue:#087db8;--cyan:#6ee7ff;--ink:#eff8ff;--muted:#a3bfd4;--panel:#102b45;--panel2:#0b2239;--line:#244a68;--green:#40d6a0}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 10% -5%,#126c9a 0,transparent 38%),radial-gradient(ellipse at 100% 25%,#431a39 0,transparent 35%),linear-gradient(160deg,#06192c,#082d4a 55%,#041426);background-attachment:fixed;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(135deg,transparent 0 37px,#7edbff 38px,#7edbff 39px,transparent 40px 78px);mask-image:linear-gradient(to bottom,black,transparent 80%)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0%,transparent 0 40%,#0005 100%)}
.app{max-width:520px;margin:auto;min-height:100vh;padding:0 13px 100px;position:relative;z-index:1}
.hero{height:280px;margin:0 -13px 13px;position:relative;overflow:hidden;border-radius:0 0 27px 27px;background:#07395d;box-shadow:0 16px 40px #0005}
.hero-img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center 38%;filter:saturate(1.08) contrast(1.05);opacity:.87}
.hero:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,#03172b22 0%,#03172b55 35%,#03172beF 100%),linear-gradient(90deg,#06182d99,#06182d00 65%)}
.hero:after{content:"";position:absolute;inset:0;z-index:1;opacity:.26;background:repeating-linear-gradient(120deg,transparent 0 50px,#d5faff 51px,#d5faff 52px,transparent 53px 100px);mask-image:linear-gradient(30deg,black,transparent 75%)}
.hero-top{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 15px);left:17px;right:17px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px}.brand-icon{display:grid;place-items:center;width:39px;height:39px;border-radius:13px;background:linear-gradient(140deg,#fa5265,#a91631);border:1px solid #ffffff66;box-shadow:0 5px 15px #0004;font-size:21px}.brand small{display:block;color:#d2f4ff;font-size:9px;font-weight:900;letter-spacing:.16em}.brand b{font-size:18px;letter-spacing:.02em}.topbadge{font-size:10px;font-weight:800;color:#d7f7ff;border:1px solid #ffffff55;background:#061c31a8;padding:7px 10px;border-radius:99px;backdrop-filter:blur(8px)}
.hero-bottom{position:absolute;z-index:2;left:19px;right:19px;bottom:20px}.hero-bottom h1{font-size:27px;line-height:1.05;margin:0 0 7px;letter-spacing:-.04em;text-shadow:0 2px 9px #0007}.hero-bottom p{font-size:12px;color:#d3efff;margin:0;max-width:340px}
.hero-stat{display:flex;gap:7px;margin-top:12px}.hero-stat span{font-size:10px;padding:5px 9px;border-radius:99px;background:#061d31b8;border:1px solid #ffffff35;color:#e5faff}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border-radius:15px;background:#06182bdc;border:1px solid #24506c;box-shadow:0 8px 22px #0003;position:sticky;top:8px;z-index:8;backdrop-filter:blur(14px)}
.tab{border:0;border-radius:11px;background:transparent;color:#a8c4d8;padding:10px 3px;font-size:12px;font-weight:850;cursor:pointer}.tab.active{background:linear-gradient(120deg,var(--red),#a82245 45%,var(--blue));color:white;box-shadow:0 4px 14px #0003}
.panel{display:none}.panel.active{display:block}.head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:19px 2px 11px}.head h2{font-size:17px;margin:0}.counter{font-size:10px;font-weight:850;color:#a9efff;background:#103b59;border:1px solid #28617e;padding:5px 9px;border-radius:99px;white-space:nowrap}
.group,.taskcard{border:1px solid #244965;border-radius:15px;overflow:hidden;background:linear-gradient(145deg,#102d48f5,#0a2138f5);margin:10px 0;box-shadow:0 8px 20px #0002}
.gtitle{display:flex;align-items:center;gap:9px;padding:11px 13px;background:linear-gradient(90deg,#153d5c,#102c47);border-bottom:1px solid #244965;color:#dff6ff;font-weight:900}.gtitle .gico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#1a5274;color:#aeeeff}
.items{padding:4px 11px 7px}.item{display:flex;align-items:flex-start;gap:8px;padding:9px 1px;border-bottom:1px solid #24435a88}.item:last-child{border-bottom:0}.item input{appearance:none;width:19px;height:19px;flex:0 0 19px;margin:2px 0 0;border:1.5px solid #527d99;border-radius:6px;background:#0b1f34;cursor:pointer;position:relative}.item input:checked{background:var(--green);border-color:var(--green)}.item input:checked:after{content:"✓";position:absolute;left:3px;top:-1px;color:#05271d;font-weight:900;font-size:14px}.item .ico{flex:0 0 21px;text-align:center;font-size:16px;line-height:1.3}.item label{flex:1;color:#e0eff8;font-size:12.5px;cursor:pointer}.item.done label{text-decoration:line-through;color:#7798ad}.cost{display:block;font-size:10px;color:#86abc3;margin-top:2px}
.composer{padding:13px;border-radius:15px;border:1px solid #2a5a78;background:linear-gradient(145deg,#103653,#0a2239);margin:12px 0;box-shadow:0 8px 20px #0002}.composer label{display:block;font-weight:900;color:#d8f7ff;margin-bottom:8px}.composer textarea{width:100%;min-height:92px;background:#061a2d;color:#e9f8ff;border:1px solid #315b76;border-radius:11px;padding:11px;font:inherit;resize:vertical;outline:none}.composer textarea:focus{border-color:#63dafa;box-shadow:0 0 0 3px #63dafa1b}.hint{font-size:11px;color:#8fb1c7;margin:7px 0 11px}.primary{width:100%;border:0;border-radius:11px;padding:11px;background:linear-gradient(100deg,#ef3348,#b61c43 45%,#087db8);color:white;font-weight:900;cursor:pointer;box-shadow:0 5px 15px #0003}
.taskhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;background:linear-gradient(90deg,#153d5b,#102b46);border-bottom:1px solid #244965}.taskhead strong{font-size:12px;color:#dff6ff}.del{border:1px solid #743a50;border-radius:8px;background:#321d32;color:#ffb5c1;padding:5px 8px;font-size:10px;font-weight:800;cursor:pointer}
.empty{padding:22px;text-align:center;color:#a1c1d5;border:1px dashed #37617b;border-radius:15px;background:#0b243a}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:9;padding:9px 13px calc(9px + env(safe-area-inset-bottom,0px));background:#06182beF;border-top:1px solid #244965;backdrop-filter:blur(15px);display:flex;justify-content:center}.bottom-inner{width:100%;max-width:500px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
@media(min-width:600px){.app{padding-top:18px}.hero{border-radius:25px;margin:0 0 15px}.bottom-nav{display:none}.tabs{position:relative;top:auto}.hero{height:330px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body>

function inventory(which){let root=document.getElementById(which+"-list");root.innerHTML="";let total=0,done=0;data[which].forEach((g,gi)=>{let card=document.createElement("article");card.className="group";let title=document.createElement("div");title.className="gtitle";title.innerHTML='<span class="gico">'+g[0]+'</span><span>'+g[1]+'</span>';card.append(title);let list=document.createElement("div");list.className="items";g[2].forEach((it,ii)=>{total++;let key=which+"-"+gi+"-"+ii,checked=st[key]===undefined?it[1]:st[key];if(checked)done++;let row=document.createElement("div");row.className="item"+(checked?" done":"");let cb=document.createElement("input");cb.type="checkbox";cb.checked=checked;cb.onchange=()=>{st[key]=cb.checked;save();inventory(which)};let ic=document.createElement("span");ic.className="ico";ic.textContent=ico(it[0]);let label=document.createElement("label");label.textContent=it[0];if(it[2]){let cost=document.createElement("span");cost.className="cost";cost.textContent=it[2];label.append(cost)}row.append(cb,ic,label);list.append(row)});card.append(list);root.append(card)});document.getElementById(which+"-count").textContent=done+"/"+total+" beres"}
function getTasks(){return st.tasks||seed.map(g=>({title:g[0],items:g[1].map(text=>({text,done:false}))}))}
function drawTasks(groups){st.tasks=groups;save();let root=document.getElementById("daily-list");root.innerHTML="";let total=0,done=0;groups.forEach((g,gi)=>{let card=document.createElement("article");card.className="taskcard";let head=document.createElement("div");head.className="taskhead";let title=document.createElement("strong");title.textContent=g.title;let del=document.createElement("button");del.className="del";del.textContent="Hapus";del.onclick=()=>{groups.splice(gi,1);drawTasks(groups)};head.append(title,del);card.append(head);let list=document.createElement("div");list.className="items";g.items.forEach((it,ii)=>{total++;if(it.done)done++;let row=document.createElement("div");row.className="item"+(it.done?" done":"");let cb=document.createElement("input");cb.type="checkbox";cb.checked=it.done;cb.onchange=()=>{it.done=cb.checked;drawTasks(groups)};let ic=document.createElement("span");ic.className="ico";ic.textContent=ico(it.text);let label=document.createElement("label");label.textContent=it.text;row.append(cb,ic,label);list.append(row)});card.append(list);root.append(card)});document.getElementById("daily-count").textContent=done+"/"+total+" beres";if(!groups.length)root.innerHTML='<div class="empty">Belum ada tugas. Tambahkan tugas di atas.</div>'}
function selectTab(name){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id===name));window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));
document.getElementById("create-task").onclick=()=>{let lines=document.getElementById("new-task").value.split(/\n/).map(s=>s.trim()).filter(Boolean);if(!lines.length)return;let groups=getTasks();groups.push({title:"✨ TUGAS BARU",items:lines.map(text=>({text,done:false}))});document.getElementById("new-task").value="";drawTasks(groups)};
inventory("work");inventory("small");drawTasks(getTasks());
</script></body></html>
